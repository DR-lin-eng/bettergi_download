<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetterGI代理下载页 - BetterGI 快速下载</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            color: #2c3e50;
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            color: #7f8c8d;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .version-badge {
            display: inline-block;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .main-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex: 1;
        }

        .proxy-notice {
            background: linear-gradient(45deg, #e3f2fd, #f3e5f5);
            border: 1px solid #bbdefb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .proxy-notice .notice-icon {
            font-size: 1.8em;
            min-width: 40px;
        }

        .proxy-notice .notice-content h4 {
            color: #1976d2;
            margin-bottom: 5px;
            font-size: 1.1em;
        }

        .proxy-notice .notice-content p {
            color: #424242;
            margin: 0;
            font-size: 0.95em;
        }

        .downloads-section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.8em;
            padding-bottom: 10px;
            border-bottom: 3px solid #ecf0f1;
        }

        .download-item {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .download-item:hover {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .download-info {
            padding: 20px;
        }

        .file-details {
            margin-bottom: 15px;
        }

        .file-name {
            font-size: 1.1em;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .file-meta {
            color: #6c757d;
            font-size: 0.9em;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .download-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            flex: 1;
            justify-content: center;
            min-width: 200px;
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .download-btn:hover::before {
            left: 100%;
        }

        .btn-proxy {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-proxy:hover {
            background: linear-gradient(45deg, #5a6fd8, #6a4190);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-proxy:active {
            transform: translateY(0);
        }

        .release-notes {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .release-notes h3 {
            color: #495057;
            margin-bottom: 15px;
            font-size: 1.4em;
        }

        .release-notes h4 {
            color: #6c757d;
            margin: 15px 0 10px 0;
            font-size: 1.1em;
        }

        .release-notes p {
            color: #6c757d;
            margin-bottom: 10px;
        }

        .release-notes ul {
            color: #6c757d;
            margin-left: 20px;
        }

        .release-notes li {
            margin-bottom: 5px;
        }

        .github-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }

        .github-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .github-link a:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .downloading {
            opacity: 0.7;
            pointer-events: none;
            position: relative;
        }

        .downloading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 0;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .header p {
                font-size: 0.9em;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .download-btn {
                font-size: 0.9em;
                padding: 10px 20px;
                min-width: auto;
            }
            
            .proxy-notice {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
            
            .proxy-notice .notice-icon {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 BetterGI代理下载</h1>
            <p>Better Genshin Impact - 快速、稳定的代理下载服务</p>
            <div id="version-info"></div>
        </div>

        <div class="main-content">
            <div class="proxy-notice">
                <div class="notice-icon">🔄</div>
                <div class="notice-content">
                    <h4>代理下载服务</h4>
                    <p>通过EdgeOne全球CDN节点代理下载，解决GitHub访问慢的问题，提供稳定快速的下载体验。</p>
                </div>
            </div>

            <div id="main-content-area">
                <div class="loading">
                    <div style="font-size: 2em; margin-bottom: 10px;">⏳</div>
                    <p>正在加载发布信息...</p>
                </div>
            </div>

            <div class="github-link">
                <p>
                    🔗 <a href="https://github.com/babalae/better-genshin-impact" target="_blank">
                        访问项目GitHub主页
                    </a> |
                    <a href="https://github.com/babalae/better-genshin-impact/releases" target="_blank">
                        查看所有版本
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script>
        let releaseData = null;

        // API配置
        const API_BASE = '/api';

        // 初始化页面
        async function initPage() {
            try {
                await loadReleaseData();
                renderPage();
            } catch (error) {
                console.error('Failed to load release data:', error);
                showError('无法加载发布信息，GitHub API可能暂时不可用，请稍后重试。');
            }
        }

        // 加载发布数据
        async function loadReleaseData() {
            const response = await fetch(`${API_BASE}/release`);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            const data = await response.json();
            releaseData = data;
        }

        // 渲染页面
        function renderPage() {
            renderVersionInfo();
            renderDownloads();
        }

        // 渲染版本信息
        function renderVersionInfo() {
            const versionDiv = document.getElementById('version-info');
            if (releaseData && releaseData.tag_name) {
                const releaseDate = releaseData.published_at ? 
                    new Date(releaseData.published_at).toLocaleDateString('zh-CN', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    }) : '未知日期';
                versionDiv.innerHTML = `
                    <div class="version-badge">
                        最新版本: ${releaseData.tag_name} (${releaseDate})
                    </div>
                `;
            }
        }

        // 渲染下载列表
        function renderDownloads() {
            const contentArea = document.getElementById('main-content-area');
            
            if (!releaseData || !releaseData.assets) {
                showError('无法获取发布信息');
                return;
            }

            let downloadsHtml = `
                <div class="downloads-section">
                    <h2>📦 文件下载</h2>
            `;

            releaseData.assets.forEach((asset, index) => {
                const sizeMB = (asset.size / 1024 / 1024).toFixed(2);
                const updateTime = asset.updated_at ? 
                    new Date(asset.updated_at).toLocaleDateString('zh-CN') : '未知';
                
                const proxyUrl = `${API_BASE}/download?d=${index}&v=${encodeURIComponent(releaseData.tag_name)}`;
                
                downloadsHtml += `
                    <div class="download-item">
                        <div class="download-info">
                            <div class="file-details">
                                <div class="file-name">
                                    📄 ${asset.name}
                                </div>
                                <div class="file-meta">
                                    <span>📊 大小: ${sizeMB} MB</span>
                                    <span>📈 下载: ${asset.download_count?.toLocaleString() || 0} 次</span>
                                    <span>🕒 更新: ${updateTime}</span>
                                </div>
                            </div>
                            <div class="download-buttons">
                                <a href="${proxyUrl}" 
                                   class="download-btn btn-proxy"
                                   onclick="handleDownload(this, event)"
                                   title="通过EdgeOne代理服务器下载">
                                    🚀 开始下载
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });

            downloadsHtml += '</div>';

            // 添加发布说明
            if (releaseData.body && releaseData.body.trim()) {
                downloadsHtml += `
                    <div class="release-notes">
                        <h3>📋 更新日志</h3>
                        ${parseMarkdown(releaseData.body)}
                    </div>
                `;
            }

            contentArea.innerHTML = downloadsHtml;
        }

        // 简单的Markdown解析
        function parseMarkdown(text) {
            return text
                .replace(/^### (.*$)/gim, '<h4>$1</h4>')
                .replace(/^## (.*$)/gim, '<h3>$1</h3>')
                .replace(/^# (.*$)/gim, '<h2>$1</h2>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/```(.*?)```/gs, '<pre><code>$1</code></pre>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
                .replace(/^[\*\-\+] (.*)$/gim, '<li>$1</li>')
                .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
                .replace(/^\d+\. (.*)$/gim, '<li>$1</li>')
                .replace(/^> (.*)$/gim, '<blockquote>$1</blockquote>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>')
                .replace(/^(.*)$/, '<p>$1</p>')
                .replace(/<p><\/p>/g, '');
        }

        // 处理下载点击
        function handleDownload(button, event) {
            // 添加下载中状态
            button.classList.add('downloading');
            const originalText = button.innerHTML;
            button.innerHTML = '⏳ 正在下载...';
            
            // 设置超时恢复按钮状态
            setTimeout(() => {
                button.classList.remove('downloading');
                button.innerHTML = originalText;
            }, 30000); // 30秒后恢复
        }

        // 显示错误信息
        function showError(message) {
            const contentArea = document.getElementById('main-content-area');
            contentArea.innerHTML = `
                <div class="error">
                    <h3>⚠️ 错误</h3>
                    <p>${message}</p>
                    <p style="margin-top: 10px;">
                        <a href="javascript:void(0)" onclick="location.reload()" style="color: #721c24; text-decoration: underline;">
                            🔄 点击重试
                        </a>
                    </p>
                </div>
            `;
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initPage();
        });
    </script>
</body>
</html>
