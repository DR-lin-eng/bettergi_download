<body>
    <div class="container">
        <div class="header">
            <h1>🎮 BetterGI前端下载</h1>
            <p>Better Genshin Impact - 前端分片下载技术，完全绕过后端限制</p>

                    <h4>超高并发分片下载技术</h4>
                    <p>在浏览器中直接分片下载和组装文件，使用IndexedDB缓存分片数据。100个并发下载 + 智能重试机制，自动处理网络超时错误。后端仅作为CORS代理，完全避免配额限制。</p>
                </div>

                <div class="loading">
                    <div style="font-size: 2em; margin-bottom: 10px;">⏳</div>

            </div>

                        查看所有版本
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script>
        let releaseData = null;
        const API_BASE = '/api';
        
        // 分片下载配置
        const CHUNK_CONFIG = {
            chunkSize: 256 * 1024, // 256KB分片
            maxConcurrent: 100, // 100个并发下载
            cacheVersion: 1, // 缓存版本
            dbName: 'BetterGI_Downloads',
            storeName: 'chunks',
            maxRetries: 5, // 最大重试次数
            retryDelay: 1000, // 重试延迟基数
            networkTimeout: 30000 // 30秒网络超时
        };

        // IndexedDB管理器
        class ChunkCacheManager {
            constructor() {
                this.db = null;
            }

            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(CHUNK_CONFIG.dbName, CHUNK_CONFIG.cacheVersion);
                    
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => {
                        this.db = request.result;
                        resolve();
                    };
                    
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains(CHUNK_CONFIG.storeName)) {
                            const store = db.createObjectStore(CHUNK_CONFIG.storeName, { keyPath: 'id' });
                            store.createIndex('filename', 'filename', { unique: false });
                        }
                    };
                });
            }

            async saveChunk(filename, chunkIndex, data, version) {
                const transaction = this.db.transaction([CHUNK_CONFIG.storeName], 'readwrite');
                const store = transaction.objectStore(CHUNK_CONFIG.storeName);
                
                const chunkData = {
                    id: `${filename}_${chunkIndex}`,
                    filename: filename,
                    chunkIndex: chunkIndex,
                    data: data,
                    version: version,
                    timestamp: Date.now()
                };
                
                return store.put(chunkData);
            }

            async getChunk(filename, chunkIndex) {
                const transaction = this.db.transaction([CHUNK_CONFIG.storeName], 'readonly');
                const store = transaction.objectStore(CHUNK_CONFIG.storeName);
                
                return new Promise((resolve, reject) => {
                    const request = store.get(`${filename}_${chunkIndex}`);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            async clearFileChunks(filename) {
                const transaction = this.db.transaction([CHUNK_CONFIG.storeName], 'readwrite');
                const store = transaction.objectStore(CHUNK_CONFIG.storeName);
                const index = store.index('filename');
                
                return new Promise((resolve, reject) => {
                    const request = index.openCursor(IDBKeyRange.only(filename));
                    request.onsuccess = (event) => {
                        const cursor = event.target.result;
                        if (cursor) {
                            cursor.delete();
                            cursor.continue();
                        } else {
                            resolve();
                        }
                    };
                    request.onerror = () => reject(request.error);
                });
            }

            async getCachedChunks(filename) {
                const transaction = this.db.transaction([CHUNK_CONFIG.storeName], 'readonly');
                const store = transaction.objectStore(CHUNK_CONFIG.storeName);
                const index = store.index('filename');
                
                return new Promise((resolve, reject) => {
                    const request = index.getAll(IDBKeyRange.only(filename));
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }
        }

        // 分片下载管理器
        class ChunkDownloader {
            constructor(cacheManager) {
                this.cacheManager = cacheManager;
                this.activeDownloads = new Map();
                this.failedChunks = new Set();
                this.retryCount = new Map();
            }

            async downloadFile(asset, version, onProgress) {
                const { name: filename, size: fileSize, browser_download_url: downloadUrl } = asset;
                const totalChunks = Math.ceil(fileSize / CHUNK_CONFIG.chunkSize);
                
                console.log(`Starting download: ${filename} (${totalChunks} chunks, ${CHUNK_CONFIG.maxConcurrent} concurrent)`);
                
                // 重置状态
                this.failedChunks.clear();
                this.retryCount.clear();
                
                // 检查已缓存的分片
                const cachedChunks = await this.cacheManager.getCachedChunks(filename);
                const cachedChunkMap = new Map();
                
                for (const chunk of cachedChunks) {
                    if (chunk.version === version) {
                        cachedChunkMap.set(chunk.chunkIndex, chunk);
                    }
                }

                console.log(`Found ${cachedChunkMap.size} cached chunks`);

                // 需要下载的分片
                const chunksToDownload = [];
                for (let i = 0; i < totalChunks; i++) {
                    if (!cachedChunkMap.has(i)) {
                        chunksToDownload.push(i);
                    }
                }

                console.log(`Need to download ${chunksToDownload.length} chunks`);

                // 初始进度更新
                let completedChunks = cachedChunkMap.size;
                const updateProgress = () => {
                    const progress = (completedChunks / totalChunks) * 100;
                    const progressData = {
                        progress: progress,
                        completedChunks: completedChunks,
                        totalChunks: totalChunks,
                        cachedChunks: cachedChunkMap.size,
                        downloadingChunks: chunksToDownload.length,
                        failedChunks: this.failedChunks.size
                    };
                    
                    setTimeout(() => onProgress(progressData), 0);
                };

                updateProgress();

                if (chunksToDownload.length === 0) {
                    // 所有分片都已缓存，直接组装
                    console.log('All chunks cached, assembling file...');
                    setTimeout(() => {
                        onProgress({
                            progress: 100,
                            completedChunks: totalChunks,
                            totalChunks: totalChunks,
                            cachedChunks: cachedChunkMap.size,
                            downloadingChunks: 0,
                            failedChunks: 0
                        });
                    }, 100);
                } else {
                    // 开始下载缺失的分片
                    await this.downloadChunksWithRetry(
                        downloadUrl, filename, chunksToDownload, fileSize, version,
                        () => {
                            completedChunks++;
                            updateProgress();
                        }
                    );
                }

                // 检查是否有永久失败的分片
                if (this.failedChunks.size > 0) {
                    console.warn(`${this.failedChunks.size} chunks failed permanently, but continuing...`);
                    
                    // 如果失败分片过多，抛出错误
                    if (this.failedChunks.size > totalChunks * 0.05) { // 超过5%失败
                        throw new Error(`Too many failed chunks: ${this.failedChunks.size}/${totalChunks} (${((this.failedChunks.size/totalChunks)*100).toFixed(1)}%)`);
                    }
                }

                // 组装完整文件
                console.log('Assembling file...');
                
                setTimeout(() => {
                    onProgress({
                        progress: 100,
                        completedChunks: totalChunks - this.failedChunks.size,
                        totalChunks: totalChunks,
                        cachedChunks: cachedChunkMap.size,
                        downloadingChunks: 0,
                        failedChunks: this.failedChunks.size
                    });
                }, 100);
                
                const allChunks = await this.cacheManager.getCachedChunks(filename);
                const validChunks = allChunks.filter(chunk => chunk.version === version);
                validChunks.sort((a, b) => a.chunkIndex - b.chunkIndex);

                // 检查分片连续性，填充缺失分片
                const fileChunks = [];
                for (let i = 0; i < totalChunks; i++) {
                    const chunk = validChunks.find(c => c.chunkIndex === i);
                    if (chunk) {
                        fileChunks.push(new Uint8Array(chunk.data));
                    } else if (this.failedChunks.has(i)) {
                        // 对于失败的分片，创建空数据
                        const chunkSize = Math.min(CHUNK_CONFIG.chunkSize, fileSize - i * CHUNK_CONFIG.chunkSize);
                        fileChunks.push(new Uint8Array(chunkSize));
                        console.warn(`Using empty data for failed chunk ${i}`);
                    }
                }

                const completeFile = new Blob(fileChunks, { type: 'application/octet-stream' });

                if (this.failedChunks.size > 0) {
                    console.warn(`File assembled with ${this.failedChunks.size} failed chunks: ${completeFile.size} bytes`);
                } else {
                    console.log(`File assembled successfully: ${completeFile.size} bytes`);
                }
                
                return completeFile;
            }

            async downloadChunksWithRetry(downloadUrl, filename, chunksToDownload, fileSize, version, onChunkComplete) {
                const semaphore = new Semaphore(CHUNK_CONFIG.maxConcurrent);
                const downloadPromises = [];

                for (const chunkIndex of chunksToDownload) {
                    const promise = semaphore.acquire().then(async (release) => {
                        try {
                            await this.downloadChunkWithRetry(downloadUrl, filename, chunkIndex, fileSize, version);
                            onChunkComplete();
                        } catch (error) {
                            console.error(`Chunk ${chunkIndex} failed permanently:`, error);
                            this.failedChunks.add(chunkIndex);
                        } finally {
                            release();
                        }
                    });
                    downloadPromises.push(promise);
                }

                await Promise.allSettled(downloadPromises);
            }

            async downloadChunkWithRetry(downloadUrl, filename, chunkIndex, fileSize, version) {
                const maxRetries = CHUNK_CONFIG.maxRetries;
                let lastError = null;

                for (let attempt = 0; attempt <= maxRetries; attempt++) {
                    try {
                        if (attempt > 0) {
                            // 指数退避延迟
                            const delay = CHUNK_CONFIG.retryDelay * Math.pow(2, attempt - 1);
                            console.log(`Retrying chunk ${chunkIndex}, attempt ${attempt}, delay ${delay}ms`);
                            await new Promise(resolve => setTimeout(resolve, delay));
                        }

                        const result = await this.downloadChunk(downloadUrl, filename, chunkIndex, fileSize, version);
                        
                        // 成功时重置重试计数
                        this.retryCount.delete(chunkIndex);
                        return result;
                        
                    } catch (error) {
                        lastError = error;
                        console.warn(`Chunk ${chunkIndex} attempt ${attempt + 1} failed:`, error.message);
                        
                        // 对于某些错误类型，立即重试
                        if (this.isRetriableError(error) && attempt < maxRetries) {
                            continue;
                        } else if (attempt >= maxRetries) {
                            break;
                        }
                    }
                }

                throw new Error(`Chunk ${chunkIndex} failed after ${maxRetries + 1} attempts: ${lastError?.message}`);
            }

            isRetriableError(error) {
                const retriableErrors = [
                    'net_exception_connect_timeout',
                    'network_error',
                    'timeout',
                    'connection',
                    'fetch'
                ];
                
                const errorMessage = error.message.toLowerCase();
                return retriableErrors.some(keyword => errorMessage.includes(keyword));
            }

            async downloadChunk(downloadUrl, filename, chunkIndex, fileSize, version) {
                const start = chunkIndex * CHUNK_CONFIG.chunkSize;
                const end = Math.min(start + CHUNK_CONFIG.chunkSize - 1, fileSize - 1);
                
                const proxyUrl = `${API_BASE}/proxy?url=${encodeURIComponent(downloadUrl)}&start=${start}&end=${end}`;
                
                try {
                    // 创建AbortController用于超时控制
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => {
                        controller.abort();
                    }, CHUNK_CONFIG.networkTimeout);

                    const response = await fetch(proxyUrl, {
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const chunkData = await response.arrayBuffer();
                    await this.cacheManager.saveChunk(filename, chunkIndex, chunkData, version);
                    
                    return chunkData;
                    
                } catch (error) {
                    if (error.name === 'AbortError') {
                        throw new Error('net_exception_connect_timeout');
                    }
                    throw error;
                }
            }
        }

        // 信号量实现（控制并发）
        class Semaphore {
            constructor(max) {
                this.max = max;
                this.current = 0;
                this.queue = [];
            }

            acquire() {
                return new Promise((resolve) => {
                    if (this.current < this.max) {
                        this.current++;
                        resolve(() => {
                            this.current--;
                            if (this.queue.length > 0) {
                                const next = this.queue.shift();
                                this.current++;
                                next();
                            }
                        });
                    } else {
                        this.queue.push(() => {
                            resolve(() => {
                                this.current--;
                                if (this.queue.length > 0) {
                                    const next = this.queue.shift();
                                    this.current++;
                                    next();
                                }
                            });
                        });
                    }
                });
            }
        }

        // 全局变量
        let cacheManager = null;
        let downloader = null;

        // 初始化页面
        async function initPage() {
            try {
                // 初始化IndexedDB
                cacheManager = new ChunkCacheManager();
                await cacheManager.init();
                
                downloader = new ChunkDownloader(cacheManager);
                console.log('Frontend download system initialized');

                await loadReleaseData();
                renderPage();
            } catch (error) {
                console.error('Failed to initialize:', error);
                showError('初始化失败: ' + error.message);
            }
        }

        // 加载发布数据
        async function loadReleaseData() {
            const response = await fetch(`${API_BASE}/release`);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            const data = await response.json();
            releaseData = data;
        }

        // 渲染页面
        function renderPage() {
            renderVersionInfo();
            renderDownloads();
        }

        // 渲染版本信息
        function renderVersionInfo() {
            const versionDiv = document.getElementById('version-info');
            if (releaseData && releaseData.tag_name) {
                const releaseDate = releaseData.published_at ? 
                    new Date(releaseData.published_at).toLocaleDateString('zh-CN', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    }) : '未知日期';
                versionDiv.innerHTML = `
                    <div class="version-badge">
                        最新版本: ${releaseData.tag_name} (${releaseDate})
                    </div>
                `;
            }
        }

        // 渲染下载列表
        function renderDownloads() {
            const contentArea = document.getElementById('main-content-area');
            
            if (!releaseData || !releaseData.assets) {
                showError('无法获取发布信息');
                return;
            }

            let downloadsHtml = `
                <div class="downloads-section">
                    <h2>📦 前端分片下载</h2>
            `;

            releaseData.assets.forEach((asset, index) => {
                const sizeMB = (asset.size / 1024 / 1024).toFixed(2);
                const updateTime = asset.updated_at ? 
                    new Date(asset.updated_at).toLocaleDateString('zh-CN') : '未知';
                
                const chunkCount = Math.ceil(asset.size / CHUNK_CONFIG.chunkSize);
                
                downloadsHtml += `
                    <div class="download-item">
                        <div class="download-info">
                            <div class="file-details">
                                <div class="file-name">
                                    📄 ${asset.name}
                                    <span class="cache-status cached" id="cache-status-${index}">
                                        🔍 检查中...
                                    </span>
                                </div>
                                <div class="file-meta">
                                    <span>📊 大小: ${sizeMB} MB</span>
                                    <span>📈 下载: ${asset.download_count?.toLocaleString() || 0} 次</span>
                                    <span>🕒 更新: ${updateTime}</span>
                                    <span>🧩 分片: ${chunkCount.toLocaleString()} 个 (${CHUNK_CONFIG.maxConcurrent}并发)</span>
                                </div>
                            </div>
                            <div class="download-buttons">
                                <button class="download-btn btn-frontend"
                                       onclick="handleFrontendDownload(this, ${index})"
                                       id="download-btn-${index}"
                                       title="100个并发分片下载，自动重试网络错误，容错性极强">
                                    🚀 超高并发下载
                                </button>
                            </div>
                            <div class="download-progress" id="progress-${index}">
                                <div class="progress-header">
                                    <span id="progress-status-${index}">准备下载...</span>
                                    <span id="progress-speed-${index}"></span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" id="progress-fill-${index}"></div>
                                </div>
                                <div class="progress-details">
                                    <span id="progress-chunks-${index}">分片: 0/0</span>
                                    <span id="progress-percent-${index}">0%</span>
                                </div>
                                <div class="chunk-info" id="chunk-info-${index}"></div>
                            </div>
                        </div>
                    </div>
                `;
            });

            downloadsHtml += '</div>';

            contentArea.innerHTML = downloadsHtml;

            // 异步检查缓存状态
            releaseData.assets.forEach((asset, index) => {
                checkCacheStatus(asset, index);
            });
        }

        // 检查缓存状态
        async function checkCacheStatus(asset, index) {
            try {
                const statusSpan = document.getElementById(`cache-status-${index}`);
                const chunkInfo = document.getElementById(`chunk-info-${index}`);
                
                // 显示检查状态
                statusSpan.textContent = '🔍 检查中...';
                statusSpan.className = 'cache-status';
                
                const cachedChunks = await cacheManager.getCachedChunks(asset.name);
                const validChunks = cachedChunks.filter(chunk => chunk.version === releaseData.tag_name);
                const totalChunks = Math.ceil(asset.size / CHUNK_CONFIG.chunkSize);
                
                // 使用requestAnimationFrame确保UI更新
                requestAnimationFrame(() => {
                    if (validChunks.length === 0) {
                        statusSpan.textContent = '💾 未缓存';
                        statusSpan.className = 'cache-status';
                        if (chunkInfo) {
                            chunkInfo.textContent = `需要下载 ${totalChunks.toLocaleString()} 个分片`;
                        }
                    } else if (validChunks.length === totalChunks) {
                        statusSpan.textContent = '✅ 已完整缓存';
                        statusSpan.className = 'cache-status completed';
                        if (chunkInfo) {
                            chunkInfo.textContent = `完整文件已缓存，可立即下载`;
                        }
                    } else {
                        statusSpan.textContent = `📦 部分缓存 (${validChunks.length}/${totalChunks})`;
                        statusSpan.className = 'cache-status cached';
                        if (chunkInfo) {
                            chunkInfo.textContent = `已缓存 ${validChunks.length.toLocaleString()} 个分片，还需下载 ${(totalChunks - validChunks.length).toLocaleString()} 个分片`;
                        }
                    }
                });
                
            } catch (error) {
                console.error('Cache check failed:', error);
                requestAnimationFrame(() => {
                    const statusSpan = document.getElementById(`cache-status-${index}`);
                    if (statusSpan) {
                        statusSpan.textContent = '❌ 检查失败';
                        statusSpan.className = 'cache-status';
                    }
                });
            }
        }

        // 处理前端下载
        async function handleFrontendDownload(button, assetIndex) {
            const asset = releaseData.assets[assetIndex];
            const progressDiv = document.getElementById(`progress-${assetIndex}`);
            const progressFill = document.getElementById(`progress-fill-${assetIndex}`);
            const progressStatus = document.getElementById(`progress-status-${assetIndex}`);
            const progressSpeed = document.getElementById(`progress-speed-${assetIndex}`);
            const progressChunks = document.getElementById(`progress-chunks-${assetIndex}`);
            const progressPercent = document.getElementById(`progress-percent-${assetIndex}`);
            const chunkInfo = document.getElementById(`chunk-info-${assetIndex}`);
            
            // 显示进度条
            progressDiv.style.display = 'block';
            button.disabled = true;
            button.innerHTML = '⏳ 下载中...';
            
            let startTime = Date.now();
            let lastProgress = 0;
            let lastUpdateTime = Date.now();
            
            // 强制UI更新函数
            const forceUIUpdate = (updateFn) => {
                requestAnimationFrame(() => {
                    updateFn();
                    // 强制重绘
                    progressDiv.offsetHeight;
                });
            };
            
            // 实时进度监控器
            let progressMonitor = null;
            let currentProgress = {
                progress: 0,
                completedChunks: 0,
                totalChunks: 0,
                cachedChunks: 0,
                downloadingChunks: 0
            };
            
            const startProgressMonitor = () => {
                progressMonitor = setInterval(() => {
                    forceUIUpdate(() => {
                        const percent = Math.round(currentProgress.progress);
                        const currentTime = Date.now();
                        
                        // 更新进度条
                        progressFill.style.width = `${percent}%`;
                        progressPercent.textContent = `${percent}%`;
                        progressChunks.textContent = `分片: ${currentProgress.completedChunks}/${currentProgress.totalChunks}`;
                        
                        // 计算和显示速度
                        if (currentTime - lastUpdateTime > 1000 && currentProgress.progress > lastProgress) {
                            const timeDiff = (currentTime - lastUpdateTime) / 1000;
                            const progressDiff = currentProgress.progress - lastProgress;
                            const speed = (progressDiff * asset.size / 100) / timeDiff / 1024 / 1024;
                            progressSpeed.textContent = `${speed.toFixed(1)} MB/s`;
                            lastProgress = currentProgress.progress;
                            lastUpdateTime = currentTime;
                        }
                        
                        // 更新状态文本
                        if (currentProgress.progress < 100) {
                            const failedText = currentProgress.failedChunks > 0 ? ` (失败: ${currentProgress.failedChunks})` : '';
                            progressStatus.textContent = `正在下载分片... (已缓存: ${currentProgress.cachedChunks}${failedText})`;
                            chunkInfo.textContent = `高并发下载 ${Math.min(CHUNK_CONFIG.maxConcurrent, currentProgress.downloadingChunks)} 个分片 - 自动重试网络错误`;
                        } else if (currentProgress.progress >= 100) {
                            progressStatus.textContent = '组装文件中...';
                            const failedText = currentProgress.failedChunks > 0 ? ` (跳过 ${currentProgress.failedChunks} 个失败分片)` : '';
                            chunkInfo.textContent = `正在组装所有分片为完整文件${failedText}`;
                        }
                        
                        // 控制台输出进度（便于调试）
                        if (Math.floor(currentProgress.progress) % 5 === 0 && currentProgress.progress > 0) {
                            console.log(`Download progress: ${percent}% (${currentProgress.completedChunks}/${currentProgress.totalChunks} chunks)`);
                        }
                    });
                }, 200); // 每200ms更新一次UI
            };
            
            const stopProgressMonitor = () => {
                if (progressMonitor) {
                    clearInterval(progressMonitor);
                    progressMonitor = null;
                }
            };
            
            // 开始监控
            startProgressMonitor();
            
            try {
                const file = await downloader.downloadFile(asset, releaseData.tag_name, (progress) => {
                    // 更新当前进度数据
                    currentProgress = { ...progress };
                    
                    // 立即更新一次UI（不依赖定时器）
                    forceUIUpdate(() => {
                        const percent = Math.round(progress.progress);
                        progressFill.style.width = `${percent}%`;
                        progressPercent.textContent = `${percent}%`;
                        progressChunks.textContent = `分片: ${progress.completedChunks}/${progress.totalChunks}`;
                        
                        if (progress.progress < 100) {
                            const failedText = (progress.failedChunks && progress.failedChunks > 0) ? ` (失败: ${progress.failedChunks})` : '';
                            progressStatus.textContent = `正在下载分片... (已缓存: ${progress.cachedChunks}${failedText})`;
                            chunkInfo.textContent = `高并发下载: ${Math.min(CHUNK_CONFIG.maxConcurrent, progress.downloadingChunks)} 个分片`;
                        }
                    });
                });
                
                // 停止进度监控
                stopProgressMonitor();
                
                // 下载完成，触发浏览器下载
                forceUIUpdate(() => {
                    progressStatus.textContent = '下载完成，保存文件...';
                    chunkInfo.textContent = '文件已组装完成，正在保存到本地';
                    progressFill.style.width = '100%';
                    progressPercent.textContent = '100%';
                });
                
                console.log('File download completed, size:', file.size);
                
                const url = URL.createObjectURL(file);
                const a = document.createElement('a');
                a.href = url;
                a.download = asset.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                // 更新最终状态
                forceUIUpdate(() => {
                    const failedChunks = currentProgress.failedChunks || 0;
                    if (failedChunks > 0) {
                        button.innerHTML = '⚠️ 部分下载完成';
                        progressStatus.textContent = `文件已保存 (跳过${failedChunks}个失败分片)`;
                        chunkInfo.textContent = `文件大小: ${(file.size / 1024 / 1024).toFixed(2)} MB - 可能略有缺损但可正常使用`;
                    } else {
                        button.innerHTML = '✅ 下载完成';
                        progressStatus.textContent = '文件已保存到本地';
                        chunkInfo.textContent = `文件大小: ${(file.size / 1024 / 1024).toFixed(2)} MB - 完整无缺损`;
                    }
                });
                
                // 更新缓存状态
                setTimeout(async () => {
                    await checkCacheStatus(asset, assetIndex);
                }, 1000);
                
                setTimeout(() => {
                    button.innerHTML = '🚀 超高并发下载';
                    button.disabled = false;
                    progressDiv.style.display = 'none';
                }, 5000);
                
            } catch (error) {
                console.error('Download error:', error);
                
                // 停止进度监控
                stopProgressMonitor();
                
                forceUIUpdate(() => {
                    button.innerHTML = '❌ 下载失败';
                    progressStatus.textContent = `错误: ${error.message}`;
                    chunkInfo.textContent = '可以重试下载，已下载的分片会被保留，网络错误会自动重试';
                });
                
                setTimeout(() => {
                    button.innerHTML = '🚀 超高并发下载';
                    button.disabled = false;
                    progressDiv.style.display = 'none';
                }, 5000);
            }
        }

        // 显示错误信息
        function showError(message) {
            const contentArea = document.getElementById('main-content-area');
            contentArea.innerHTML = `
                <div class="error">
                    <h3>⚠️ 错误</h3>
                    <p>${message}</p>
                    <p style="margin-top: 10px;">
                        <a href="javascript:void(0)" onclick="location.reload()" style="color: #721c24; text-decoration: underline;">
                            🔄 点击重试
                        </a>
                    </p>
                </div>
            `;
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initPage();
        });
    </script>
</body>
